name: "Set up Godot"
description: Install caller-reviewed archives through the immutable released shared
  installer
inputs:
  godot-version:
    description: Godot version to install (e.g., 4.4.1)
    required: true
  godot-sha256:
    description: SHA-256 of the Godot Linux archive
    required: true
  install-templates:
    description: Whether to install export templates
    required: false
    default: 'false'
  templates-sha256:
    description: SHA-256 of the export templates archive
    required: false
    default: ''
runs:
  using: composite
  steps:
  - name: "Set up Godot"
    uses: nicodes/tools/godot-setup@ca747e13a51f301f51635c262d883d57d6084ae3 # v0.27.1
    with:
      version: ${{ inputs.godot-version }}
      origin: godot
      binary-checksum: sha256:${{ inputs.godot-sha256 }}
      templates-checksum: sha256:${{ inputs.templates-sha256 }}
      install-templates: ${{ inputs.install-templates }}
