name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Bounded, so a step that hangs fails here rather than sitting until the
    # runner's own timeout hours later.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Determine release version
        id: release
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          latest="$(git tag --list 'v[0-9]*' | sed -E 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -z "$latest" ]; then
            version="0.0.1"
          else
            IFS=. read -r major minor patch <<< "$latest"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            version="${major}.${minor}.${patch}"
          fi
          plugin_version="$(sed -n -E 's/^version="([^"]+)"/\1/p' addon/plugin.cfg)"
          test "$plugin_version" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      # The same checks CI runs, from the same definition. This workflow used
      # to package and publish without running any of them -- the only thing
      # between a broken commit and the GDAM registry was whether somebody had
      # looked at CI. Running them here against this exact commit is the point:
      # CI passing on this SHA earlier is a claim about that run.
      - name: Test
        uses: ./.github/actions/test

      - name: Package addon
        run: |
          package_root="dist/@aviorstudio_gd-pocketbase"
          mkdir -p "$package_root"
          cp addon/plugin.cfg addon/plugin.gd "$package_root/"
          cp addon/*.uid "$package_root/" 2>/dev/null || true
          cp -R addon/src "$package_root/"
          (cd "$package_root" && zip -r "../@aviorstudio_gd-pocketbase.zip" .)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.release.outputs.tag }}" dist/*.zip --title "${{ steps.release.outputs.tag }}" --notes "Release ${{ steps.release.outputs.tag }}"
      - name: Install GDAM
        uses: aviorstudio/gdam-actions/install@v0.0.1
      - name: Publish to GDAM
        uses: aviorstudio/gdam-actions/publish@v0.0.1
        with:
          version: ${{ steps.release.outputs.version }}
          tag: ${{ steps.release.outputs.tag }}
          secret-key: ${{ secrets.GDAM_SECRET_KEY }}
