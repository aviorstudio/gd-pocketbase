name: Release
'on':
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options:
        - patch
        - minor
        - major
permissions:
  contents: read
jobs:
  test:
    name: Test package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Set up development tools
      uses: nicodes/tools/setup@f7e243524ce2aa29f299e4c79db33001f72f4a30
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 5
    - name: Check project
      shell: bash
      run: |-
        set -euo pipefail
        mise run check
    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: tested-release-zip
        path: |
          dist/@aviorstudio_gd-pocketbase.zip
          dist/@aviorstudio_gd-pocketbase.zip.sha256
        if-no-files-found: error
        retention-days: 1
    permissions:
      contents: read
      attestations: read
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
  publish:
    name: Publish release
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Download artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: tested-release-zip
        path: dist
    - name: Determine release version
      id: release
      env:
        BUMP: ${{ inputs.bump }}
      run: |-
        set -euo pipefail
        latest="$(git tag --list 'v[0-9]*' | sed -E 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
        if [ -z "$latest" ]; then
          version="0.0.1"
        else
          IFS=. read -r major minor patch <<< "$latest"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="${major}.${minor}.${patch}"
        fi
        plugin_version="$(sed -n -E 's/^version="([^"]+)"/\1/p' addon/plugin.cfg)"
        test "$plugin_version" = "$version"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "tag=v$version" >> "$GITHUB_OUTPUT"
    - name: Verify tested release ZIP
      run: |-
        (cd dist && sha256sum --check @aviorstudio_gd-pocketbase.zip.sha256)
        ./scripts/verify_package.sh dist/@aviorstudio_gd-pocketbase.zip
    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release create "${{ steps.release.outputs.tag }}" dist/@aviorstudio_gd-pocketbase.zip --target "$GITHUB_SHA"
        --title "${{ steps.release.outputs.tag }}" --notes "Release ${{ steps.release.outputs.tag }} from $GITHUB_SHA"
    - name: Publish addon
      uses: aviorstudio/gdam-actions/publish@3a46007e296e60e15a4ad47727ad33046e52e6ea
      with:
        tag: ${{ steps.release.outputs.tag }}
        asset: '@aviorstudio_gd-pocketbase.zip'
